<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>ご登録ありがとうございます｜Asiatopro</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --navy:#0f172a; --gold:#d97706; --gold-lt:#fbbf24; --paper:#f8fafc;
    --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:"Noto Sans CJK JP","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    background:radial-gradient(120% 90% at 80% 0%, #1c2c48 0%, var(--navy) 55%, #0b1120 100%);
    color:#e2e8f0;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    line-height:1.85;
  }
  .card{max-width:520px;width:100%;text-align:center;}
  .logo{width:56mm;max-width:220px;height:auto;margin-bottom:26px;}
  .icon{
    width:64px;height:64px;border-radius:50%;
    background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
  }
  h1{font-size:1.55rem;color:#fff;margin:0 0 12px;line-height:1.6;}
  p{color:#cbd5e1;font-size:.98rem;margin:0 0 8px;}

  .dl-card{
    margin-top:28px;background:#fff;border-radius:14px;padding:26px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:left;
  }
  .dl-title{color:var(--navy);font-weight:700;font-size:1rem;margin-bottom:4px;}
  .dl-sub{color:var(--muted);font-size:.85rem;margin-bottom:18px;}
  .dl-btn{
    display:block;width:100%;text-align:center;text-decoration:none;
    background:var(--gold);color:#1a1206;font-weight:700;font-size:1.02rem;
    padding:16px 20px;border-radius:10px;box-shadow:0 6px 20px rgba(217,119,6,.28);
  }
  .dl-btn .sub{display:block;font-size:.72rem;font-weight:500;opacity:.8;margin-top:3px;}

  .cta2{
    margin-top:20px;padding:16px 18px;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:.85rem;color:#cbd5e1;
  }
  .cta2 a{color:var(--gold-lt);font-weight:700;text-decoration:none;border-bottom:1px solid rgba(251,191,36,.4);}

  .disclaimer{
    margin-top:22px;font-size:.72rem;color:#94a3b8;line-height:1.8;text-align:left;
    border-top:1px solid rgba(255,255,255,.1);padding-top:14px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/logo/asiatopro-white.png" alt="asiatopro">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.2"><path d="M5 13l4 4L19 7"/></svg>
    </div>
    <h1>ご登録ありがとうございます</h1>
    <p>「レアアース関連銘柄ハンドブック」を、下のボタンからダウンロードいただけます。</p>

    <div class="dl-card">
      <div class="dl-title">レアアース関連銘柄ハンドブック</div>
      <div class="dl-sub">PDF・全14ページ・約1MB</div>
      <a class="dl-btn" href="https://asiatopro.com/downloads/asiatopro-rare-earth-handbook.pdf" download>
        ハンドブックをダウンロード
        <span class="sub">クリックしてPDFを開く・保存する</span>
      </a>
    </div>

    <div class="cta2">
      今後、レアアースの最新動向を随時メールでお届けします。<br>
      サイトでも記事を更新していますので、あわせてご覧ください → <a href="https://asiatopro.com/">asiatopro.com</a>
    </div>

    <div class="disclaimer">
      本資料は情報提供を目的としたものであり、特定の金融商品・銘柄の売買を推奨・勧誘するものではありません。投資に関する最終判断は、最新のIR情報をご確認のうえ、ご自身の責任において行ってください。
    </div>
  </div>
</body>
</html>
