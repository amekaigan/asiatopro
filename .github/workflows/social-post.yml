name: Update site listings and post new articles to SNS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rare-earth/**/index.html'
      - 'about/index.html'
      - 'index.html'
      - '.github/scripts/**'

permissions:
  contents: write

jobs:
  update-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Japanese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Generate thumbnails
        run: |
          npm install sharp twitter-api-v2 --no-save --silent
          node .github/scripts/gen-thumbs.js

      - name: Regenerate site listings (rare-earth index, top page, sitemap)
        run: node .github/scripts/generate-site.js

      - name: Run SNS posting script
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: node .github/scripts/social-post.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: auto-update site listings and posted articles [skip ci]"
          git pull --rebase origin main || git rebase --abort
          git push || (git pull --rebase origin main && git push)
